<div class="layout-wrapper">
  <app-header />

  <div class="layout-body">
    <!-- Sidebar only for Desktop -->
    @if ((isMobile$ | async) === false) {
      <app-sidebar />
    }

    <!-- Main content -->
    <main class="layout-content">
      <router-outlet />
    </main>
  </div>

  <!-- NavBottom only for Mobile -->
  @if (isMobile$ | async) {
    <app-bottom-nav />
  }
</div>
